<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Options Lab Master — Capped-Risk Interactive Guide</title>
<style>
  :root {
    --bg: #0b1016;
    --panel: #121a24;
    --line: #293443;
    --text: #eef3fa;
    --muted: #a7b6c8;
    --mint: #9ceeab;
    --blue: #7ebaff;
    --amber: #ffd089;
    --loss: #ffada3;
    --soft: #1b2733;
    --card-bg: #0d151e;
  }

  /* Theme Transitions & Light Variables */
  html {
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  html[data-theme="light"] {
    --bg: #f5f8fb;
    --panel: #ffffff;
    --line: #d8e2ed;
    --text: #1a2330;
    --muted: #475569;
    --mint: #0e8a40;
    --blue: #1d6fd6;
    --amber: #b86e00;
    --loss: #cf222e;
    --soft: #eef4fb;
    --card-bg: #ffffff;
  }

  /* Light theme overrides for custom dark panels & elements */
  html[data-theme="light"] aside {
    background: #edf2f8;
    border-right-color: var(--line);
  }
  html[data-theme="light"] .topbar {
    background: #edf2f8;
    border-bottom-color: var(--line);
  }
  html[data-theme="light"] nav button:hover {
    background: #e1e9f2;
  }
  html[data-theme="light"] nav button.active {
    background: #d4edda;
    border-color: #28a745;
    color: #0e8a40;
  }
  html[data-theme="light"] .card {
    background: #ffffff;
    border-color: #d8e2ed;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  html[data-theme="light"] .stat-box {
    background: #f8fafc;
    border-color: #e2e8f0;
  }
  html[data-theme="light"] .visual-card {
    background: #0d151e;
    border-color: #243142;
  }
  html[data-theme="light"] .visual-title {
    color: #eef3fa;
  }
  html[data-theme="light"] .visual-caption {
    color: #cbd5e1;
  }
  html[data-theme="light"] .callout {
    background: #eff6ff;
    border-left-color: #2563eb;
    color: #1e3a8a;
  }
  html[data-theme="light"] .callout strong {
    color: #1e40af;
  }
  html[data-theme="light"] .callout-warn {
    background: #fffbeb;
    border-left-color: #d97706;
    color: #78350f;
  }
  html[data-theme="light"] .callout-warn strong {
    color: #92400e;
  }
  html[data-theme="light"] .setup-panel {
    background: #f8fafc;
    border-color: #cbd5e1;
  }
  html[data-theme="light"] .formula-banner {
    background: #f1f5f9;
    border-color: #cbd5e1;
    color: #0f172a;
  }
  html[data-theme="light"] .contracts-box {
    background: #ecfdf5;
    border-color: #059669;
  }
  html[data-theme="light"] .quiz-container {
    background: #f8fafc;
    border-color: #cbd5e1;
  }
  html[data-theme="light"] .quiz-option {
    background: #ffffff;
    border-color: #cbd5e1;
    color: var(--text);
  }
  html[data-theme="light"] .quiz-option:hover {
    background: #f1f5f9;
  }
  html[data-theme="light"] .mobile-select {
    background: #ffffff;
    color: var(--text);
    border-color: #cbd5e1;
  }
  html[data-theme="light"] .theme-btn {
    border-color: #cbd5e1;
    color: var(--text);
  }
  html[data-theme="light"] .theme-btn:hover {
    background: #e2e8f0;
  }
  html[data-theme="light"] input,
  html[data-theme="light"] select {
    background: #ffffff;
    color: var(--text);
    border-color: #cbd5e1;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  .layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 100vh;
  }
  aside {
    background: #0d141d;
    border-right: 1px solid var(--line);
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--mint);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-group { margin-bottom: 20px; }
  .nav-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 700;
  }
  nav button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 4px;
    transition: all 0.15s ease;
  }
  nav button:hover { background: #1a2634; color: var(--text); }
  nav button.active {
    background: #1b2e24;
    color: var(--mint);
    border-color: #2e4d3b;
    font-weight: 600;
  }
  main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .content-container {
    padding: 32px 40px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  h1, h2, h3 { color: var(--text); margin-top: 0; }
  .eyebrow {
    color: var(--mint);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .lead {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .stat-box {
    background: #090e13;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .stat-val {
    font-size: 24px;
    font-weight: 700;
    margin: 6px 0;
    color: var(--text);
  }
  .stat-val.positive { color: var(--mint); }
  .stat-val.negative { color: var(--loss); }
  .callout {
    background: #11202e;
    border-left: 4px solid var(--blue);
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin: 16px 0;
    font-size: 14px;
  }
  .callout-warn {
    background: #261b11;
    border-left: 4px solid var(--amber);
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin: 16px 0;
    font-size: 14px;
  }
  .setup-panel {
    background: #090e13;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
  }
  .formula-banner {
    text-align: center;
    padding: 14px;
    background: #090e13;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 17px;
    font-weight: 700;
    margin: 16px 0;
  }
  .contracts-box {
    border: 2px solid var(--mint);
    background: #14281e;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    padding: 9px 12px;
    background: #090e13;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--mint);
  }
  .small { font-size: 12px; }
  .muted { color: var(--muted); }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  th {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    background: #121c27;
    border: 1px solid var(--line);
    padding: 12px 16px;
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 10px;
    transition: all 0.15s ease;
  }
  .quiz-option:hover {
    background: #1a2837;
    border-color: var(--mint);
  }
  .quiz-option.correct {
    background: #14281e !important;
    border-color: var(--mint) !important;
    color: var(--mint) !important;
  }
  .quiz-option.wrong {
    background: #2f1717 !important;
    border-color: var(--loss) !important;
    color: var(--loss) !important;
  }
  .tablewrap {
    overflow-x: auto;
    margin: 20px 0;
  }
  .visual-card {
    background: #0d151e;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin: 20px 0;
    text-align: center;
  }
  .visual-card svg {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .visual-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .visual-caption {
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.5;
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag-mint { background: #183323; color: var(--mint); border: 1px solid #2e4d3b; }
  .tag-loss { background: #3a1c1c; color: var(--loss); border: 1px solid #5a2e2e; }
  .tag-blue { background: #17263c; color: var(--blue); border: 1px solid #28446b; }
  .tag-amber { background: #332612; color: var(--amber); border: 1px solid #5c431e; }
  .quiz-container {
    background: #0e1722;
    border: 1px solid #2d3c4d;
    border-radius: 10px;
    padding: 20px;
    margin-top: 24px;
  }
  .quiz-feedback {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
    line-height: 1.5;
  }
  .quiz-feedback.positive {
    background: #14281e;
    border: 1px solid #2e5940;
    color: var(--mint);
  }
  .quiz-feedback.negative {
    background: #2f1717;
    border: 1px solid #632e2e;
    color: var(--loss);
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin: 16px 0;
  }

  /* Topbar & Header */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #0d141d;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    max-width: 650px;
  }
  .mobile-brand {
    font-size: 17px;
    font-weight: 700;
    color: var(--mint);
    white-space: nowrap;
    display: none;
  }
  .mobile-select {
    width: 100%;
    padding: 8px 12px;
    background: #090e13;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: none;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .theme-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .theme-btn:hover {
    background: var(--soft);
  }

  /* Range Sliders */
  input[type="range"] {
    accent-color: var(--mint);
  }

  /* Responsive Mobile Breakpoints */
  @media (max-width: 850px) {
    .layout {
      grid-template-columns: 1fr;
    }
    aside {
      display: none;
    }
    .mobile-brand {
      display: block;
    }
    .mobile-select {
      display: block;
    }
    .topbar {
      padding: 10px 16px;
    }
    .content-container {
      padding: 16px 14px;
    }
    .card {
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid-2, .grid-3 {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .stat-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .stat-val {
      font-size: 18px;
    }
    .visual-card {
      padding: 12px;
      margin: 14px 0;
    }
    .visual-card svg {
      width: 100%;
      height: auto;
      max-height: 280px;
    }
    h1 {
      font-size: 24px;
      line-height: 1.25;
    }
    .tablewrap {
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .tablewrap table {
      min-width: 580px;
    }
    th, td {
      padding: 9px 12px;
      font-size: 13px;
    }
  }
</style>
</head>

  <aside>

    <div class="nav-group">

<script>
const tabs = {
  // Phase 1
  m1_1: `
    <div class="visual-card" style="margin-top:0; padding:10px; margin-bottom:24px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" style="height:auto; display:block;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1016" />
      <stop offset="50%" stop-color="#101924" />
      <stop offset="100%" stop-color="#080d13" />
    </linearGradient>
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ceeab" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#9ceeab" stop-opacity="1" />
      <stop offset="100%" stop-color="#7ebaff" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="glow-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ceeab" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9ceeab" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2c3b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#293443" stroke-width="2"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Glowing background circles -->
  <circle cx="200" cy="160" r="180" fill="#9ceeab" opacity="0.05" filter="url(#glow)"/>
  <circle cx="950" cy="140" r="220" fill="#7ebaff" opacity="0.06" filter="url(#glow)"/>

  <!-- Left: Stylized Options Payoff Curve -->
  <g transform="translate(60, 40)">
    <!-- Zero axis -->
    <line x1="0" y1="140" x2="480" y2="140" stroke="#475569" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="490" y="144" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">$0 Breakeven</text>

    <!-- Shaded Profit Area -->
    <polygon points="120,140 240,60 460,60 460,140" fill="url(#glow-area)"/>

    <!-- Payoff Curve (Bull Put Spread / Defined Risk) -->

    <div class="eyebrow">Phase 2 · Module 2.2</div>
    <h1>Implied Volatility (IV) & Understanding the Volatility Risk Premium</h1>

    <div class="card">
      <h2>1. Historical Volatility (HV) vs. Implied Volatility (IV)</h2>
      <p>To evaluate option pricing, you must distinguish between actual price history and forward market pricing:</p>
      <ul>
        <li><strong>Historical Volatility (HV):</strong> The annualized standard deviation of past log-returns of the underlying stock over a specific lookback window (e.g., 20, 30, or 252 trading days). It measures past movement.</li>
        <li><strong>Implied Volatility (IV):</strong> The annualized expected volatility implied by current market option prices when solved through an options pricing model. It represents the market's collective forward-looking consensus.</li>
      </ul>

      <div class="callout">
        <strong>💎 The Volatility Risk Premium (VRP):</strong><br>
        Empirical financial studies (including Cboe research on equity index options like the S&P 500) demonstrate that <strong>Implied Volatility has historically traded higher on average than subsequently realized volatility</strong> over matching horizons. Buyers pay a premium for downside insurance, creating a potential variance risk premium that options sellers attempt to capture. However, buying protective wings also purchases volatility, so managing net exposure and sizing remains vital.
      </div>
    </div>

    <div class="card">
      <h2>2. IV Rank (IVR) vs. IV Percentile (IVP)</h2>

      <h2>1. Why Buy a Debit Spread Instead of a Single Long Option?</h2>
      <p>Buying a standalone call or put forces you to fight the clock: every single day, Theta decay erodes the option's value. To generate a profit, the stock must not only move in your direction, it must move <em>fast enough</em> to overcome time decay.</p>
      
      <p>A <strong>Vertical Debit Spread</strong> solves this by selling a cheaper Out-of-the-Money option against your purchased option:</p>
      <ul>
        <li><strong>Financing Time Decay:</strong> The short leg collects theta decay and volatility value, subsidizing the cost of the purchased option.</li>
        <li><strong>Lower Breakeven:</strong> Because you pay less net debit, the stock does not need to rally nearly as far to reach profitability.</li>
        <li><strong>Defined Risk:</strong> Your maximum loss is 100% strictly capped at the net debit paid upfront.</li>
      </ul>

function initTheme() {
  const saved = localStorage.getItem('options_lab_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeBtn(saved);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('options_lab_theme', next);
  updateThemeBtn(next);
}

function updateThemeBtn(theme) {
  const btn = document.getElementById('themeToggleBtn');
  if (btn) {
    btn.innerHTML = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
  }
}

function showTab(id) {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const clickAttr = btn.getAttribute('onclick') || '';
    if (clickAttr.includes(`'${id}'`)) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  const mobileSelect = document.getElementById('mobileLesson');
  if (mobileSelect && mobileSelect.value !== id) {
    mobileSelect.value = id;
  }

  const content = document.getElementById('content');
  if (tabs[id]) {
    content.innerHTML = tabs[id];
  } else {
    content.innerHTML = `<div class="card"><h2>Module ${id}</h2><p>Content coming soon...</p></div>`;
  }

  // Hook tool initializers
  if (id === 'tool_payoff') {
    initPayoffLab();
  } else if (id === 'tool_calc') {
    initCalcTool();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkQuiz(btn, isCorrect, explanation) {
  const container = btn.closest('.quiz-container');
  container.querySelectorAll('.quiz-option').forEach(b => {
    b.disabled = true;
    b.style.cursor = 'default';
  });
  if (isCorrect) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
  }
  const fb = container.querySelector('.quiz-feedback');
  if (fb) {
    fb.style.display = 'block';
    fb.className = 'quiz-feedback ' + (isCorrect ? 'positive' : 'negative');
    fb.innerHTML = (isCorrect ? '✅ <strong>Correct!</strong> ' : '❌ <strong>Incorrect.</strong> ') + explanation;
  }
}

// Interactive Payoff Lab
function initPayoffLab() {
  updatePayoffLab();
}

function onWidthChange() {
  const widthInput = document.getElementById('lab_width');
  const creditInput = document.getElementById('lab_credit');
  if (widthInput && creditInput) {
    const width = parseFloat(widthInput.value) || 5;
    creditInput.max = (Math.max(0.1, width - 0.1)).toFixed(2);
    if (parseFloat(creditInput.value) >= width) {
      creditInput.value = (width * 0.3).toFixed(2);
    }
  }
  updatePayoffLab();
}

function updatePayoffLab() {
  const warn = document.getElementById('lab_warning');
  if (warn) warn.style.display = 'none';

  const strategy = document.getElementById('lab_strategy')?.value || 'bull_put';
  const stock = parseFloat(document.getElementById('lab_stock')?.value || 100);
  const shortStrike = parseFloat(document.getElementById('lab_short')?.value || 95);
  const width = parseFloat(document.getElementById('lab_width')?.value || 5);
  let credit = parseFloat(document.getElementById('lab_credit')?.value || 1.50);

  if (document.getElementById('lbl_stock')) document.getElementById('lbl_stock').textContent = '$' + stock.toFixed(2);
  if (document.getElementById('lbl_short')) document.getElementById('lbl_short').textContent = '$' + shortStrike.toFixed(2);
  if (document.getElementById('lbl_width')) document.getElementById('lbl_width').textContent = '$' + width.toFixed(2) + ' wide';
  if (document.getElementById('lbl_credit')) document.getElementById('lbl_credit').textContent = '$' + credit.toFixed(2) + ' / sh';

  if (isNaN(stock) || isNaN(shortStrike) || isNaN(width) || isNaN(credit) || width <= 0 || credit <= 0) {
    if (warn) { warn.textContent = 'Please enter valid positive values for stock, strike, width, and credit.'; warn.style.display = 'block'; }
    return;
  }
  if (credit >= width) {
    if (warn) { warn.textContent = `Credit ($${credit.toFixed(2)}) must be strictly less than spread width ($${width.toFixed(2)}).`; warn.style.display = 'block'; }
    return;
  }

  const longStrike = strategy === 'bull_put' ? shortStrike - width : shortStrike + width;
  const maxProfit = credit * 100;
  const maxLoss = (width - credit) * 100;
  const breakeven = strategy === 'bull_put' ? shortStrike - credit : shortStrike + credit;
  const rrRatio = maxProfit > 0 ? (maxLoss / maxProfit).toFixed(2) : '0';

  if (document.getElementById('lab_max_profit')) document.getElementById('lab_max_profit').textContent = '+$' + maxProfit.toFixed(0) + ' USD';
  if (document.getElementById('lab_max_loss')) document.getElementById('lab_max_loss').textContent = '-$' + maxLoss.toFixed(0) + ' USD';
  if (document.getElementById('lab_breakeven')) document.getElementById('lab_breakeven').textContent = '$' + breakeven.toFixed(2);
  if (document.getElementById('lab_rr')) document.getElementById('lab_rr').textContent = rrRatio + ' : 1';

  // SVG Payoff Curve
  const svg = document.getElementById('lab_svg');
  if (!svg) return;

  const minX = Math.min(stock, shortStrike, longStrike, breakeven) - 10;
  const maxX = Math.max(stock, shortStrike, longStrike, breakeven) + 10;
  const rangeX = Math.max(maxX - minX, 1);

  const toX = (val) => 35 + ((val - minX) / rangeX) * 380;

  // Linear P&L to Y mapping
  const zeroY = 115;
  const scaleMax = Math.max(maxProfit, maxLoss) * 1.35;
  const toY = (pnl) => zeroY - (pnl / scaleMax) * 75;

  let points = '';
  if (strategy === 'bull_put') {
    const p1 = `${toX(minX)},${toY(-maxLoss)}`;
    const p2 = `${toX(longStrike)},${toY(-maxLoss)}`;
    const p3 = `${toX(shortStrike)},${toY(maxProfit)}`;
    const p4 = `${toX(maxX)},${toY(maxProfit)}`;
    points = `${p1} ${p2} ${p3} ${p4}`;
  } else {
    const p1 = `${toX(minX)},${toY(maxProfit)}`;
    const p2 = `${toX(shortStrike)},${toY(maxProfit)}`;
    const p3 = `${toX(longStrike)},${toY(-maxLoss)}`;
    const p4 = `${toX(maxX)},${toY(-maxLoss)}`;
    points = `${p1} ${p2} ${p3} ${p4}`;
  }

  const stockX = toX(stock);
  const beX = toX(breakeven);

  svg.innerHTML = `
    <rect x="0" y="0" width="450" height="220" rx="8" fill="#090e14" stroke="#293443"/>
    <!-- Zero P&L line -->
    <line x1="25" y1="${zeroY}" x2="425" y2="${zeroY}" stroke="#475569" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="430" y="${zeroY + 4}" fill="#94a3b8" font-size="10">$0</text>

    <!-- Payoff polyline -->
    <polyline points="${points}" fill="none" stroke="#9ceeab" stroke-width="3"/>

    <!-- Breakeven point -->
    <circle cx="${beX}" cy="${zeroY}" r="5" fill="#7ebaff"/>
    <text x="${beX}" y="${zeroY + 16}" text-anchor="middle" fill="#7ebaff" font-size="10" font-weight="700">B/E $${breakeven.toFixed(2)}</text>

    <!-- Current Stock Price Line -->
    <line x1="${stockX}" y1="20" x2="${stockX}" y2="190" stroke="#ffd089" stroke-width="2" stroke-dasharray="4"/>
    <text x="${stockX}" y="28" text-anchor="middle" fill="#ffd089" font-size="11" font-weight="700">Stock $${stock.toFixed(0)}</text>

    <!-- Labels -->
    <text x="35" y="${toY(maxProfit) - 6}" fill="#9ceeab" font-size="11" font-weight="700">+$${maxProfit.toFixed(0)} Max</text>
    <text x="35" y="${toY(-maxLoss) + 16}" fill="#ffada3" font-size="11" font-weight="700">-$${maxLoss.toFixed(0)} Max</text>
  `;
}

function updateCalcTool() {
  const err = document.getElementById('calc_error');
  if (err) err.style.display = 'none';

  const equityNZD = parseFloat(document.getElementById('calc_equity')?.value);
  const fx = parseFloat(document.getElementById('calc_fx')?.value);
  const riskPct = parseFloat(document.getElementById('calc_risk')?.value || 2.0);
  const width = parseFloat(document.getElementById('calc_width')?.value);
  const credit = parseFloat(document.getElementById('calc_credit')?.value);
  const fees = parseFloat(document.getElementById('calc_fees')?.value || 2.0);
  const winRatePct = parseFloat(document.getElementById('calc_winrate')?.value || 70);

  if (document.getElementById('lbl_calc_risk')) document.getElementById('lbl_calc_risk').textContent = riskPct.toFixed(1) + '%';
  if (document.getElementById('res_risk_pct_label')) document.getElementById('res_risk_pct_label').textContent = riskPct.toFixed(1);
  if (document.getElementById('lbl_calc_winrate')) document.getElementById('lbl_calc_winrate').textContent = winRatePct.toFixed(0) + '%';

  if (isNaN(equityNZD) || equityNZD <= 0 || isNaN(fx) || fx <= 0 || isNaN(width) || width <= 0 || isNaN(credit) || credit <= 0) {
    if (err) { err.textContent = 'Please enter valid positive values for equity, exchange rate, spread width, and credit.'; err.style.display = 'block'; }
    return;
  }
  if (credit >= width) {
    if (err) { err.textContent = `Credit ($${credit.toFixed(2)}) must be strictly less than spread width ($${width.toFixed(2)}).`; err.style.display = 'block'; }
    return;
  }

  // Integer cents calculation to avoid floating point precision issues
  const usdEquityCents = Math.round(equityNZD * fx * 100);
  const usdEquity = usdEquityCents / 100;
  
  const riskBudgetCents = Math.floor(usdEquityCents * (riskPct / 100));
  const riskBudgetUSD = riskBudgetCents / 100;
  const riskBudgetNZD = equityNZD * (riskPct / 100);

  const contractualLossCents = Math.round((width - credit) * 10000);
  const feesCents = Math.round((isNaN(fees) ? 0 : fees) * 100);
  const totalLossPerSpreadCents = contractualLossCents + feesCents;
  const totalLossPerSpreadUSD = totalLossPerSpreadCents / 100;

  const maxContracts = totalLossPerSpreadCents > 0 ? Math.floor(riskBudgetCents / totalLossPerSpreadCents) : 0;

  // Expectancy calculation (per 1 spread, hypothetical 2-outcome model)
  const maxWinUSD = credit * 100;
  const contractualLossUSD = (width - credit) * 100;
  const winRate = winRatePct / 100;
  const lossRate = 1 - winRate;
  const evUSD = (winRate * maxWinUSD) - (lossRate * contractualLossUSD) - (feesCents / 100);
  const evNZD = fx > 0 ? evUSD / fx : 0;

  if (document.getElementById('res_usd_equity')) document.getElementById('res_usd_equity').textContent = '$' + usdEquity.toLocaleString(undefined, {maximumFractionDigits:0}) + ' USD';
  if (document.getElementById('res_risk_budget')) document.getElementById('res_risk_budget').textContent = '$' + riskBudgetUSD.toFixed(0) + ' USD';
  if (document.getElementById('res_risk_budget_nzd')) document.getElementById('res_risk_budget_nzd').textContent = `~$${riskBudgetNZD.toFixed(0)} NZD ceiling`;
  if (document.getElementById('res_spread_loss')) document.getElementById('res_spread_loss').textContent = '$' + totalLossPerSpreadUSD.toFixed(0) + ' USD';
  
  const contractsElem = document.getElementById('res_contracts');
  if (contractsElem) {
    if (maxContracts >= 1) {
      contractsElem.textContent = maxContracts + (maxContracts === 1 ? ' Contract' : ' Contracts');
      contractsElem.style.color = 'var(--mint)';
    } else {
      contractsElem.textContent = '0 (Pass Trade)';
      contractsElem.style.color = 'var(--loss)';
    }
  }

  const evElem = document.getElementById('res_ev');
  const evSub = document.getElementById('res_ev_sub');
  if (evElem) {
    const sign = evUSD >= 0 ? '+' : '';
    evElem.textContent = `${sign}$${evUSD.toFixed(2)} USD (${sign}$${evNZD.toFixed(2)} NZD)`;
    evElem.style.color = evUSD >= 0 ? 'var(--mint)' : 'var(--loss)';
  }
  if (evSub) {
    evSub.textContent = `Hypothetical two-outcome model: ${winRatePct}% full win ($${maxWinUSD.toFixed(0)}) vs ${100 - winRatePct}% full loss ($${contractualLossUSD.toFixed(0)}) less $${(feesCents/100).toFixed(2)} fees.`;
  }
}

// Initialize
initTheme();
showTab('m1_1');
</script>
</body>
</html>
